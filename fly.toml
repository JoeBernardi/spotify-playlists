# fly.toml app configuration file generated for spotify-playlists on 2024-12-19T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "likes-song"
primary_region = "ord"

[build]

[env]
NODE_ENV = "production"
STABLE_PLAYLISTS_PATH = "/data/stable-playlists.json"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health/ready"

[[mounts]]
source = "spotify_data"
destination = "/data"


[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256

[deploy]
release_command = "echo 'Deploying likes-song'"
